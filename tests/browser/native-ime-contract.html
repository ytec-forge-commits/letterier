<!doctype html><html lang="ja"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Native IME boundary fixture</title><body><div id="fixture" class="paper-scroll" tabindex="0"><div class="page-edit" data-page-index="0"><span class="body-line"><span data-offset="0" data-end="2">前後</span></span></div></div><script type="module">
// Only the IPC transport is replaced. The adapter, range preview and events are real.
const calls=[],handlers=new Map();let id=0;

window.__TAURI_INTERNALS__={transformCallback(handler){handlers.set(++id,handler);return id;},unregisterCallback(key){handlers.delete(key);},invoke(command,args){calls.push({command,args});return Promise.resolve(command==='plugin:event|listen'?100:{available:true});}};

</script></body></html>
