[package]
name = "binsen-kobo"
version = "1.0.4"
description = "レタリエ — 手紙・便箋作成アプリ"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
png = "0.17"
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Foundation", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-single-instance = "=2.4.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"
